# 智约管理后台 + API 反向代理（Docker Compose 内部使用）
# 手动部署时，把 upstream 里的 backend:3000 改成 127.0.0.1:3000。
upstream zhiyue_backend {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 对象存储上传走 API，这里限制请求体大小
    client_max_body_size 8m;

    # Let's Encrypt 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 同域 API，管理端 axios baseURL=/api，不存在跨域
    location /api/ {
        proxy_pass http://zhiyue_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 带哈希的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue Router history 模式：刷新 /bookings、/stats 等子路由不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
