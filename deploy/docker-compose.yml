# 智约一键部署：MySQL + 后端 API + Nginx 管理端
# 使用：cd deploy && cp .env.example .env && 编辑 .env && docker compose up -d --build
name: zhiyue

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-zhiyue}
      MYSQL_USER: ${DB_USER:-zhiyue}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时执行
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 设置 JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-zhiyue}
      DB_USER: ${DB_USER:-zhiyue}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: uploads
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    volumes:
      # local 驱动的图片持久化；切换 S3 后不再使用
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

  web:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      # 申请证书后启用：
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      # 证书目录，申请证书后启用（只读挂载 host 的 Let's Encrypt）
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

volumes:
  mysql_data:
  uploads_data:
